# ===============================
# Datasource / H2 In-Memory Database
# ===============================
spring.datasource.url=jdbc:h2:mem:transactions-db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===============================
# JPA / Hibernate
# ===============================

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# H2 Console
# ===============================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ===============================
# Server
# ===============================
server.port=8082

# properties
# Replace with a secure random key (32+ chars)
jwt.secret=replace_this_with_a_secure_random_32+_char_string
# JWT token validity in milliseconds (e.g., 1 hour)
jwt.token-validity=3600000

# helpful JPA defaults
spring.jpa.hibernate.ddl-auto=update

