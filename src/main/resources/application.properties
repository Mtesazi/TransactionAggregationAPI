# ===============================
# Datasource / H2 In-Memory Database
# ===============================
spring.datasource.url=jdbc:h2:mem:transactions-db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===============================
# JPA / Hibernate
# ===============================

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# H2 Console
# ===============================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true


# ===============================
# Server
# ===============================
server.port=8082

# properties
# Development default secret (replace with a secure random key for production)
jwt.secret=0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF
# JWT token validity in milliseconds (e.g., 1 hour)
jwt.token-validity=3600000


# helpful JPA defaults
spring.jpa.hibernate.ddl-auto=update

# Development helpers
# Enable the debug token endpoint (/auth/debug-token)
auth.debug=true
# Enable debug logging for application packages
logging.level.org.example=DEBUG
